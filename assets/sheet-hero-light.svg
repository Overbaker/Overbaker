<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-label="Overbaker — Former architect building minimal, load-bearing AI agent and systems tooling">
  <!-- Warm drafting paper canvas -->
  <rect width="1200" height="410" rx="12" fill="#FAF8F4"/>
  <!-- Outer & inner architectural drawing frame (图框) -->
  <rect x="14" y="14" width="1172" height="382" fill="none" stroke="#1C1917" stroke-width="1.5"/>
  <rect x="22" y="22" width="1156" height="366" fill="none" stroke="#D6D3CD" stroke-width="0.9"/>

  <!-- Subtle architectural orthographic grid -->
  <g stroke="#E7E4DD" stroke-width="0.6">
    <line x1="22" y1="74" x2="1178" y2="74"/>
    <line x1="22" y1="268" x2="1178" y2="268"/>
    <line x1="311" y1="268" x2="311" y2="388"/>
    <line x1="600" y1="268" x2="600" y2="388"/>
    <line x1="889" y1="268" x2="889" y2="388"/>
    <line x1="860" y1="74" x2="860" y2="268"/>
  </g>

  <!-- Corner registration crosshairs -->
  <g stroke="#A8A29E" stroke-width="1">
    <line x1="34" y1="36" x2="46" y2="36"/><line x1="40" y1="30" x2="40" y2="42"/>
    <line x1="1154" y1="36" x2="1166" y2="36"/><line x1="1160" y1="30" x2="1160" y2="42"/>
  </g>

  <!-- Top Header Strip -->
  <text x="58" y="53" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#78716C" letter-spacing="1.8">SHEET 01 / 02  ·  ELEVATION &amp; ETHOS  ·  SCALE 1:1</text>
  <text x="1144" y="53" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#C24136" letter-spacing="1.4">GITHUB.COM/OVERBAKER</text>

  <!-- Main Architectural Lockup -->
  <text x="56" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#18181B" letter-spacing="2">OVERBAKER</text>
  <rect x="412" y="106" width="292" height="28" fill="none" stroke="#C24136" stroke-width="1.2"/>
  <text x="558" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#C24136" letter-spacing="1.4">FORMER ARCHITECT → SYSTEMS</text>

  <text x="56" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#292524">Bake the architecture. Cut everything that isn't load-bearing.</text>
  <text x="56" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#57534E">Small, legible cores · transparent boundaries · zero hidden hooks · evidence over ornament.</text>

  <!-- Dimension Callout Line -->
  <g stroke="#C24136" stroke-width="1">
    <line x1="56" y1="240" x2="796" y2="240"/>
    <line x1="56" y1="234" x2="56" y2="246"/>
    <line x1="796" y1="234" x2="796" y2="246"/>
  </g>
  <rect x="332" y="229" width="188" height="22" fill="#FAF8F4"/>
  <text x="426" y="244" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#C24136" letter-spacing="1">LESS, BUT LOAD-BEARING</text>

  <!-- Right-side Minimal Architectural Axonometric / Section Motif -->
  <g transform="translate(918, 98)">
    <!-- Plan grid lines -->
    <line x1="0" y1="138" x2="210" y2="138" stroke="#A8A29E" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="105" y1="6" x2="105" y2="150" stroke="#A8A29E" stroke-width="0.9" stroke-dasharray="3 3"/>
    <!-- Structural elevation columns & slab -->
    <rect x="28" y="34" width="154" height="10" fill="#18181B"/>
    <rect x="44" y="44" width="10" height="94" fill="none" stroke="#18181B" stroke-width="1.6"/>
    <rect x="100" y="44" width="10" height="94" fill="#C24136"/>
    <rect x="156" y="44" width="10" height="94" fill="none" stroke="#18181B" stroke-width="1.6"/>
    <rect x="20" y="88" width="170" height="6" fill="none" stroke="#18181B" stroke-width="1.4"/>
    <!-- Section cut markers A - A -->
    <circle cx="14" cy="91" r="9" fill="#FAF8F4" stroke="#C24136" stroke-width="1.3"/>
    <text x="14" y="95" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700" fill="#C24136">A</text>
    <circle cx="196" cy="91" r="9" fill="#FAF8F4" stroke="#C24136" stroke-width="1.3"/>
    <text x="196" y="95" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700" fill="#C24136">A</text>
    <text x="105" y="158" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#78716C" letter-spacing="1.2">SEC. A-A · CORE &amp; JOINTS</text>
  </g>

  <!-- Bottom 4-Column Blueprint Title Block (图签栏) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#C24136" letter-spacing="1">
    <text x="46" y="298">01 · LOAD-BEARING CORE</text>
    <text x="335" y="298">02 · NO HIDDEN MAGIC</text>
    <text x="624" y="298">03 · EVIDENCE OVER FAITH</text>
    <text x="913" y="298">04 · HUMAN TASTE</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181B">
    <text x="46" y="328">Tiny, fast, auditable</text>
    <text x="335" y="328">Explicit boundaries</text>
    <text x="624" y="328">Measured, not guessed</text>
    <text x="913" y="328">Proportion holds the system</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534E">
    <text x="46" y="352">4.4 MiB wrapper · 0 runtime deps</text>
    <text x="46" y="370">1.4 KB rules · 1.5 MB offline APK</text>

    <text x="335" y="352">0 per-turn hooks · offline tests</text>
    <text x="335" y="370">No black-box routers or bloat</text>

    <text x="624" y="352">Blind A/B lessons · ratcheting gates</text>
    <text x="624" y="370">Real PSS &amp; parity harness proofs</text>

    <text x="913" y="352">Models write code quickly; crisp</text>
    <text x="913" y="370">joints keep software standing</text>
  </g>
</svg>
