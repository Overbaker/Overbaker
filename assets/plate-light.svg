<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Overbaker — Former architect. Space, proportion, and software that stays out of the way.">
  <rect width="1200" height="220" rx="10" fill="#FAF8F4"/>
  <rect x="14" y="14" width="1172" height="192" fill="none" stroke="#18181B" stroke-width="1.1"/>

  <!-- Left: Clean Architectural Typography -->
  <text x="56" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#C24136" letter-spacing="2">FORMER ARCHITECT</text>
  <text x="56" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#18181B" letter-spacing="2">OVERBAKER</text>
  <text x="56" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#57534E">Bake the architecture. Leave room to think.</text>

  <!-- Subtle vertical divider -->
  <line x1="858" y1="38" x2="858" y2="182" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Right: Minimalist Architectural Free Plan (Miesian planes, void, threshold & door-swing arc) -->
  <g transform="translate(894, 34)">
    <!-- Soft architectural light/courtyard wash -->
    <rect x="34" y="20" width="92" height="58" fill="#F1EDE4"/>
    <!-- Fine axis hairlines -->
    <line x1="0" y1="126" x2="256" y2="126" stroke="#D6D3CD" stroke-width="0.8" stroke-dasharray="3 3"/>
    <line x1="126" y1="0" x2="126" y2="136" stroke="#D6D3CD" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- Free-plan architectural walls (bold ink strokes) -->
    <line x1="16" y1="20" x2="164" y2="20" stroke="#18181B" stroke-width="4" stroke-linecap="square"/>
    <line x1="126" y1="20" x2="126" y2="82" stroke="#18181B" stroke-width="4" stroke-linecap="square"/>
    <line x1="80" y1="78" x2="236" y2="78" stroke="#18181B" stroke-width="4" stroke-linecap="square"/>
    <line x1="34" y1="78" x2="34" y2="126" stroke="#18181B" stroke-width="3" stroke-linecap="square"/>

    <!-- Glazing / curtain-wall double hairline -->
    <line x1="164" y1="20" x2="236" y2="20" stroke="#78716C" stroke-width="1"/>
    <line x1="164" y1="24" x2="236" y2="24" stroke="#78716C" stroke-width="1"/>

    <!-- Threshold / Door swing arc (quintessential architect's symbol) -->
    <line x1="34" y1="78" x2="34" y2="42" stroke="#C24136" stroke-width="1.6"/>
    <path d="M 34 42 A 36 36 0 0 1 70 78" fill="none" stroke="#C24136" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Spatial entry point -->
    <circle cx="192" cy="50" r="3.5" fill="#C24136"/>

    <text x="128" y="152" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#78716C" letter-spacing="1.6">PLAN  ·  VOID &amp; THRESHOLD</text>
  </g>
</svg>
