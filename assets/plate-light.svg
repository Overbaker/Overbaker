<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Overbaker — fake architect. bake the architecture.">
  <rect width="1200" height="200" rx="10" fill="#FAF8F4"/>
  <rect x="0.75" y="0.75" width="1198.5" height="198.5" rx="9.5" fill="none" stroke="#E5E1D8" stroke-width="1.5"/>

  <!-- Left: Quiet Typography -->
  <text x="52" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#C24136" letter-spacing="1.4">fake architect</text>
  <text x="52" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#18181B" letter-spacing="1.5">OVERBAKER</text>
  <text x="52" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#78716C">bake the architecture.</text>

  <!-- Right: Minimal open-ended architecture growing freely from a quiet core -->
  <g transform="translate(720, 18)">
    <!-- Subtle organic growth grid / spatial trace -->
    <line x1="20" y1="132" x2="430" y2="132" stroke="#E7E3DA" stroke-width="0.9"/>
    <line x1="158" y1="12" x2="158" y2="156" stroke="#E7E3DA" stroke-width="0.9"/>

    <!-- Soft open courtyard washes (light & breath, unboxed) -->
    <rect x="86" y="42" width="72" height="52" fill="#F2EFE8"/>
    <rect x="224" y="68" width="96" height="64" fill="#F5F2EC"/>

    <!-- Core room: crisp, small, open -->
    <line x1="68" y1="42" x2="196" y2="42" stroke="#18181B" stroke-width="2.6" stroke-linecap="square"/>
    <line x1="158" y1="42" x2="158" y2="108" stroke="#18181B" stroke-width="2.6" stroke-linecap="square"/>

    <!-- Secondary extension growing organically outward -->
    <line x1="128" y1="94" x2="294" y2="94" stroke="#18181B" stroke-width="2" stroke-linecap="square"/>
    <line x1="258" y1="60" x2="258" y2="132" stroke="#18181B" stroke-width="1.6" stroke-linecap="square"/>

    <!-- Further light, open-ended traces (still growing) -->
    <line x1="258" y1="60" x2="366" y2="60" stroke="#57534E" stroke-width="1.2"/>
    <line x1="332" y1="60" x2="332" y2="112" stroke="#78716C" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="312" y1="132" x2="412" y2="132" stroke="#A8A29E" stroke-width="1" stroke-dasharray="3 5"/>

    <!-- Single quiet door-swing arc -->
    <line x1="86" y1="94" x2="86" y2="64" stroke="#C24136" stroke-width="1.4"/>
    <path d="M 86 64 A 30 30 0 0 1 116 94" fill="none" stroke="#C24136" stroke-width="1.1" stroke-dasharray="2.5 2.5"/>

    <!-- Growing tip point -->
    <circle cx="366" cy="60" r="3" fill="#C24136"/>
  </g>
</svg>
