  <text x="264" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#292524">Local-first remote control for 100+ Claude Code, Codex, Antigravity &amp; Pi sessions on one host — swaps only HAPI's O(N)</text>
